<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,700;1,700&family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/navbar.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/index.css') }}"
    />
    <link
      rel="icon"
      href="{{ url_for('static', filename='img/widget_color.png') }}"
      type="image/png"
    />
  </head>

  <body>
    <div
      id="voti"
      data-grades="{{ voti | tojson | safe }}" 
      style="display: none"
      <!-- dataset.grades -->
    ></div>
    <div>{% include "navbar.html" %}</div>

    <h3>Ciao, {{ info["nome"] }}</h3>
    <h3>da qualche parte, {{ info["anno_scolastico"] }}</h3>
    <h3>{{ info["classe"] }} - {{ info["indirizzo"] }}</h3>
    <p>media + vedi di piu</p>
    <p>compiti imminenti + vedi di piu</p>
    <p>materie di oggi + vdp</p>
    <p>privacy policy</p>
    <div class="container-avg" id="container-avg">
      <select name="subject" id="subject-filter">
        <option value="all">Tutte le materie</option>
        {% for materia in materie.values() %}
        <option value="{{ materia.nome }}">{{ materia.nome }}</option>
        {% endfor %}
      </select>

      <select name="quadrimestre" id="quadrimestre">
        <option value="primo">Primo</option>
        <option value="secondo">Secondo</option>
        <option value="entrambi">Entrambi</option>
      </select>
      <p class="media" id="media">Prova</p>
    </div>
    <script>
      let votiElemento = document.getElementById("voti");
      console.log(votiElemento.dataset.grades)
      const voti = JSON.parse(votiElemento.dataset.grades);
      console.log(voti);

      let quadrimestre = document.getElementById("quadrimestre");
      let materia = document.getElementById("subject");

      quadrimestre.addEventListener("change", compute);
      materia.addEventListener("change", compute);

      function compute(e) {}
    </script>
  </body>
</html>
