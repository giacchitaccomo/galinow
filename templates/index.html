<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,700;1,700&family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/navbar.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/index.css') }}"
    />
    <link
      rel="icon"
      href="{{ url_for('static', filename='img/widget_color.png') }}"
      type="image/png"
    />
  </head>

  <body>
    <div
      id="voti"
      data-grades="{{ voti | tojson | forceescape }}"
      style="display: none"
    ></div>
    <div
      id="materie_map"
      data-materie="{{ materie | tojson | forceescape }}"
      data-materie2="{{ materie2 | tojson | forceescape }}"
      style="display: none"
    ></div>

    <div>{% include "navbar.html" %}</div>

    <main class="dashboard-container">
      <!-- Header block -->
      <header class="welcome-header">
        <h3>Ciao, {{ info["nome"] }}</h3>
        <div class="meta-info">
          <span>Anno Scolastico: {{ info["anno_scolastico"] }}</span> &bull;
          <span>{{ info["classe"] }} - {{ info["indirizzo"] }}</span>
        </div>
      </header>

      <!-- Quick Context Links / Mock Dashboard items -->
      <section class="quick-grid">
        <div class="quick-card">
          <p>Compiti Imminenti</p>
          <a href="#">Vedi di più</a>
        </div>
        <div class="quick-card">
          <p>Materie di Oggi</p>
          <a href="#">Vedi registro</a>
        </div>
        <div class="quick-card">
          <p>Privacy Policy</p>
          <a href="#">Leggi</a>
        </div>
      </section>

      <!-- Grade Calculator Interactive Block -->
      <section class="calculator-section">
        <h4>Calcolo Media Voti</h4>

        <div class="container-avg" id="container-avg">
          <div class="select-group">
            <label for="subject">Materia</label>
            <select name="subject" id="subject">
              <option value="all">Tutte le materie</option>
              {% for materia in materie.values() %}
              <option value="{{ materia.nome }}">{{ materia.nome }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="select-group">
            <label for="quadrimestre">Periodo</label>
            <select name="quadrimestre" id="quadrimestre">
              <option value="1">Primo Quadrimestre</option>
              <option value="2">Secondo Quadrimestre</option>
              <option value="all">Entrambi</option>
            </select>
          </div>

          <div class="metric-box">
            <span>Media</span>
            <p class="media" id="media">--</p>
          </div>
        </div>
      </section>
    </main>

    <script>
      const votiElemento = document.getElementById("voti");
      const votiListaRaw = JSON.parse(votiElemento.dataset.grades);

      let votiNew = [];

      const materieElem = document.getElementById("materie_map");
      const materieObj = JSON.parse(materieElem.dataset.materie);
      const materie2Obj = JSON.parse(materieElem.dataset.materie2 || "{}");
      const subjMap = {};

      // ------------------------------------------
      for (const id in materie2Obj) {
        const desc = (materie2Obj[id].nome || "").trim().toLowerCase();
        const disp =
          materieObj[id] && materieObj[id].nome
            ? materieObj[id].nome
            : materie2Obj[id].nome || "";
        if (desc) subjMap[desc] = disp;
      }
      for (const cat in votiListaRaw) {
        for (const key in votiListaRaw[cat]) {
          const rawMat = votiListaRaw[cat][key]["materia"];
          const mapped = subjMap[(rawMat || "").trim().toLowerCase()] || rawMat;
          votiNew.push({
            valore: votiListaRaw[cat][key]["valore"],
            materia: mapped,
            quadrimestre: votiListaRaw[cat][key]["quadrimestre"],
          });
        }
      } //fatto con ai per evitare mismatch variabili
      // ------------------------------------------

      const quadrimestreScelta = document.getElementById("quadrimestre");
      const materiaScelta = document.getElementById("subject");
      const scrittaMedia = document.getElementById("media");

      quadrimestreScelta.addEventListener("change", compute);
      materiaScelta.addEventListener("change", compute);

      compute();

      function compute() {
        let total = 0;
        let scored = 0;
        const quadrimestre = quadrimestreScelta.value;
        const materia = materiaScelta.value;

        for (const idx in votiNew) {
          if (
            (quadrimestre === "all" ||
              quadrimestre == votiNew[idx]["quadrimestre"]) &&
            (materia === "all" || materia === votiNew[idx]["materia"])
          ) {
            if (votiNew[idx]["valore"]) {
              total += votiNew[idx]["valore"];
              scored += 1;
            }
          }
        }

        if (scored > 0) {
          total = (total / scored).toFixed(1);
        } else {
          total = "Nessuno";
        }

        scrittaMedia.innerText = total;
      }
    </script>
  </body>
</html>
