<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,700;1,700&family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/navbar.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/index.css') }}"
    />
    <link
      rel="icon"
      href="{{ url_for('static', filename='img/widget_color.png') }}"
      type="image/png"
    />
  </head>

  <body>
    <div
      id="voti"
      data-grades="{{ voti | tojson | forceescape }}"
      style="display: none"
    ></div>
    <div
      id="materie_map"
      data-materie="{{ materie | tojson | forceescape }}"
      data-materie2="{{ materie2 | tojson | forceescape }}"
      style="display: none"
    ></div>

    <div>{% include "navbar.html" %}</div>

    <main class="dashboard-container">
      <!-- Header block -->
      <header class="welcome-header">
        <h3>Ciao, {{ info["nome"] }}</h3>
        <div class="meta-info">
          <span>Anno Scolastico: {{ info["anno_scolastico"] }}</span> &bull;
          <span>{{ info["classe"] }} - {{ info["indirizzo"] }}</span>
        </div>
      </header>

      <!-- Quick Context Links / Mock Dashboard items -->
      <section class="quick-grid">
        <div class="quick-card">
          <p>Privacy Policy</p>
          <a
            href="https://www.iubenda.com/privacy-policy/52550761"
            class="iubenda-white iubenda-noiframe iubenda-embed"
            title="Privacy Policy "
            >Leggi</a
          >
        </div>
      </section>

      <section class="calculator-section">
        <h4>Calcolo e Predizione Voti</h4>

        <div class="container-avg">
          <div class="select-group">
            <label for="subject">Materia</label>
            <select name="subject" id="subject">
              <option value="all">Tutte le materie</option>
              {% for materia in materie.values() %}
              <option value="{{ materia.nome }}">{{ materia.nome }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="select-group">
            <label for="quadrimestre">Periodo</label>
            <select name="quadrimestre" id="quadrimestre">
              <option value="1">Primo Quadrimestre</option>
              <option value="2">Secondo Quadrimestre</option>
              <option value="all">Entrambi</option>
            </select>
          </div>

          <div class="metric-box">
            <span>Media Corrente</span>
            <p class="media" id="media">--</p>
          </div>
        </div>

        <!-- Row Divider -->
        <div class="calculator-divider"></div>

        <!-- Row 2: Target Predictor Inputs & Output -->
        <div class="container-avg">
          <div class="select-group">
            <label for="target-average">Media Obiettivo</label>
            <input
              type="number"
              name="target-average"
              id="target-average"
              list="average-presets"
              placeholder="Scegli o inserisci..."
              min="1"
              max="10"
            />
            <datalist id="average-presets">
              <option value="6.0"></option>
              <option value="6.5"></option>
              <option value="7.0"></option>
              <option value="7.5"></option>
              <option value="8.0"></option>
              <option value="8.5"></option>
              <option value="9.0"></option>
            </datalist>
          </div>
          <div class="select-group">
            <label for="grades-count">Numero Verifiche Future</label>
            <select name="grades-count" id="grades-count">
              <option value="1">Nella prossima verifica</option>
              <option value="2">Nelle prossime 2 verifiche</option>
              <option value="3">Nelle prossime 3 verifiche</option>
              <option value="4">Nelle prossime 4 verifiche</option>
            </select>
          </div>

          <div class="metric-box target-box">
            <span>Voto Necessario</span>
            <p class="media" id="required-grade">--</p>
          </div>
        </div>
      </section>
    </main>

    <script>
      const votiElemento = document.getElementById("voti");
      const votiListaRaw = JSON.parse(votiElemento.dataset.grades);

      let votiNew = [];

      const materieElem = document.getElementById("materie_map");
      const materieObj = JSON.parse(materieElem.dataset.materie);
      const materie2Obj = JSON.parse(materieElem.dataset.materie2 || "{}");
      const subjMap = {};

      // ------------------------------------------
      for (const id in materie2Obj) {
        const desc = (materie2Obj[id].nome || "").trim().toLowerCase();
        const disp =
          materieObj[id] && materieObj[id].nome
            ? materieObj[id].nome
            : materie2Obj[id].nome || "";
        if (desc) subjMap[desc] = disp;
      }
      for (const cat in votiListaRaw) {
        for (const key in votiListaRaw[cat]) {
          const rawMat = votiListaRaw[cat][key]["materia"];
          const mapped = subjMap[(rawMat || "").trim().toLowerCase()] || rawMat;
          votiNew.push({
            valore: votiListaRaw[cat][key]["valore"],
            materia: mapped,
            quadrimestre: votiListaRaw[cat][key]["quadrimestre"],
          });
        }
      } //fatto con ai per evitare mismatch variabili
      // ------------------------------------------

      const quadrimestreScelta = document.getElementById("quadrimestre");
      const materiaScelta = document.getElementById("subject");
      const scrittaMedia = document.getElementById("media");
      let sceltaMediaFuturoSelezione =
        document.getElementById("target-average");
      let numeroVotiFuturoSelezione = document.getElementById("grades-count");
      let displayMediaFuturo = document.getElementById("required-grade");

      sceltaMediaFuturoSelezione.addEventListener("input", compute);
      numeroVotiFuturoSelezione.addEventListener("input", compute);
      quadrimestreScelta.addEventListener("input", compute);
      materiaScelta.addEventListener("input", compute);

      compute();

      function compute() {
        let total = 0;
        let scored = 0;
        let answerFuturo = "--";
        let answer = "--";
        let totaliVotiFuturo = 0;
        let numeroVotiFuturo = Number(numeroVotiFuturoSelezione.value);
        let mediaObiettivo = Number(sceltaMediaFuturoSelezione.value);
        const quadrimestre = quadrimestreScelta.value;
        const materia = materiaScelta.value;

        if (mediaObiettivo > 10) {
          sceltaMediaFuturoSelezione.value =
            sceltaMediaFuturoSelezione.value.slice(0, -1);
          mediaObiettivo = sceltaMediaFuturoSelezione.value;
        }

        for (const idx in votiNew) {
          if (
            (quadrimestre === "all" ||
              quadrimestre == votiNew[idx]["quadrimestre"]) &&
            (materia === "all" || materia === votiNew[idx]["materia"])
          ) {
            if (votiNew[idx]["valore"]) {
              total += votiNew[idx]["valore"];
              scored += 1;
            }
          }
        }

        if (scored > 0) {
          answer = (total / scored).toFixed(2);
        } else {
          answer = "--";
        }
        if (mediaObiettivo > 0) {
          totaliVotiFuturo = scored + numeroVotiFuturo;
          answerFuturo = (
            (mediaObiettivo * totaliVotiFuturo - total) /
            numeroVotiFuturo
          ).toFixed(2);
        } else {
          answerFuturo = "--";
        }

        console.log(
          "Per avere una media del ",
          mediaObiettivo,
          "con voti in più:",
          numeroVotiFuturo,
          "e avendo gia voti",
          scored,
          "per avere in tutto una media di",
          mediaObiettivo * totaliVotiFuturo,
          "ho bisogno di",
          answerFuturo,
        );

        scrittaMedia.innerText = answer;
        displayMediaFuturo.innerText = answerFuturo;
      }
    </script>
    <script type="text/javascript">
      (function (w, d) {
        var loader = function () {
          var s = d.createElement("script"),
            tag = d.getElementsByTagName("script")[0];
          s.src = "https://cdn.iubenda.com/iubenda.js";
          tag.parentNode.insertBefore(s, tag);
        };
        if (w.addEventListener) {
          w.addEventListener("load", loader, false);
        } else if (w.attachEvent) {
          w.attachEvent("onload", loader);
        } else {
          w.onload = loader;
        }
      })(window, document);
    </script>
  </body>
</html>
