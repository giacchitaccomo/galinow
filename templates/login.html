<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,700;1,700&family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/navbar.css') }}"
    />
    <link rel="stylesheet" href="/static/css/login.css" />
    <link
      rel="icon"
      href="{{ url_for('static', filename='img/widget_color.png') }}"
      type="image/png"
    />
    <style></style>
  </head>
  <body>
    <img
      class="sfondo"
      src="https://images.unsplash.com/photo-1580582932707-520aed937b7b?q=80&w=1632&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
      alt="sfondo"
    />
    <div class="overlay-opaque"></div>

    <div class="content">
      <form method="post" action="{{ url_for('login') }}">
        {% if error %}
        <div class="login-error">{{ error }}</div>
        {% endif %}

        <input
          name="username"
          class="credenziali-in"
          placeholder="Username"
          type="text"
          required
        />
        <input
          name="password"
          class="credenziali-in"
          placeholder="Password"
          type="password"
          required
        />
        <button type="submit">Accedi</button>
      </form>
    </div>
  </body>
</html>
